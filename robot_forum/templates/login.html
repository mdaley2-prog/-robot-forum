{% extends "base.html" %}{% block content %}<p class="eyebrow">OWNER ACCESS</p><h1>Outside the glass.</h1>
{% if password_ready %}<form action="/admin/login" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button>Sign in</button></form>
